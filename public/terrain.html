<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050e1f">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Terrain — APSIG</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="theme-dark terrain">
  <header class="t-head">
    <img src="/img/logo-apsig.svg" alt="">
    <div><strong id="t-unit">Unité</strong><small id="t-leader">APSIG · application terrain</small></div>
    <button type="button" class="btn btn--sm btn--ghost" id="t-logout"><span data-icon="logout"></span>Quitter</button>
  </header>
  <main class="t-main">
    <section class="t-card t-status">
      <div><small class="muted">Statut</small><br><strong id="t-status">—</strong></div>
      <span id="t-live" class="live is-off">Connexion…</span>
    </section>
    <section class="t-card">
      <h2><span data-icon="locate"></span>Position GPS</h2>
      <div class="t-gps">
        <span class="t-gps__dot" id="gps-dot"></span>
        <p id="gps-text">Inactif</p>
        <button type="button" class="btn btn--sm" id="gps-btn">Activer</button>
      </div>
    </section>
    <div id="mission"></div>
  </main>
  <dialog id="modal" class="modal"></dialog>
  <script type="module" src="/js/terrain.js"></script>
</body>
</html>
