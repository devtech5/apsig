<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2a63">
  <title>Plaques — Code-Secours CI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/"><img src="/img/logo-apsig.svg" alt=""><div><strong>APSIG</strong><span>Sécurité pour tous, en toute confiance</span></div></a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="/">Accueil</a>
        <a href="/demo" target="_blank" rel="noopener">Page SOS</a>
        <a href="/centrale">Centrale</a>
        <a href="/plaques" aria-current="page">Plaques</a>
      </nav>
    </div>
  </header>
  <div class="demo-ribbon">Prototype de démonstration — titulaires, numéros et établissements fictifs.</div>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Parc de plaques</h1>
        <p>Chaque plaque porte une adresse Code-Secours unique et un QR code menant à sa page SOS.</p>
      </div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="toolbar">
      <label class="field field--search"><span data-icon="search"></span><input id="q" type="search" placeholder="Code, quartier, titulaire, établissement…"></label>
      <select id="pass" class="field" aria-label="Pass">
        <option value="">Tous les Pass</option><option value="bleu">Pass Bleu</option><option value="rouge">Pass Rouge Premium</option>
      </select>
      <select id="commune" class="field" aria-label="Commune"><option value="">Toutes communes</option></select>
    </div>
    <div class="plate-grid" id="grid"></div>
    <div class="more"><button type="button" class="btn" id="more" hidden>Afficher plus</button></div>
  </main>

  <script type="module" src="/js/plaques.js"></script>
</body>
</html>
