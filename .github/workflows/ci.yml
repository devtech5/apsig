name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Vérification syntaxique
        run: for f in server.js src/*.js scripts/*.js public/js/*.js; do node --check "$f"; done
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t code-secours:ci .
      - name: Démarrage et contrôle de santé
        run: |
          docker run -d --name cs -p 3000:3000 code-secours:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs cs
          exit 1
